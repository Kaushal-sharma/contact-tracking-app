<template>
    <div class="c-container">
        <lightning-layout multiple-rows="true">
           
            <lightning-layout-item size="12">
                
                <div class="slds-p-around_medium lgc-bg">
                    <lightning-tile label="Contact Tracing" type="media">
                        <lightning-icon slot="media" icon-name="standard:groups"></lightning-icon>
                            <span class="slds-page-header__title">{tabName}</span>
                            <span><lightning-button label="New" slot="actions" onclick={createNewRecord} style="float:right; margin-top:-40px;"></lightning-button></span>
                    </lightning-tile>
                </div>
                
                <lightning-layout class="lgc-bg-white">
                    
                    <template for:each={healthStatus} for:item="status">
                        <span key={status.id} class="slds-m-left_medium">
                            <lightning-layout-item flexibility="auto, no-grow" padding="around-small">
                                <div class={status.color}>{status.label}</div>
                                <div>{status.count}</div>
                            </lightning-layout-item>
                        </span>
                    </template>
                </lightning-layout> 

            </lightning-layout-item>
        </lightning-layout>

        <lightning-layout-item size="12">

                <lightning-tabset variant="vertical">
                    
                    <lightning-tab onactive={handleActive} label="Person View" value="person">
                        <lightning-layout>
                            <lightning-layout-item size="8" padding="horizontal-small">
                                Person
                                <!-- <c:CTRecentChanges scope="person" /> -->
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="horizontal-small">
                                Person view
                                <!-- <c:CTPersonView />  -->
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-tab>

                    <lightning-tab onactive={handleActive} label="Location View" value="location">
                        <lightning-layout>
                            <lightning-layout-item size="8" padding="horizontal-small">
                                Location
                                <!-- <c:CTRecentChanges scope="location" /> -->
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="horizontal-small"> 
                                Location View
                                <!-- <c:CTLocationView />  -->
                            </lightning-layout-item>
                        </lightning-layout>
                    </lightning-tab>

                </lightning-tabset>

            </lightning-layout-item>
    </div>
</template>
