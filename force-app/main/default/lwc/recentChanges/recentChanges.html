<template>
    <div class="c-container">
        <lightning-card title="Recent Updates">
                <div onkeyup={handleKeyUp} slot="actions">
                    <lightning-input name="search" label="Hit 'enter' to search" aura-id="enter-search" type="search" placeholder="Search here..." onkeyup={handleKeyUp}></lightning-input>
                </div>
            <lightning-datatable key-field="Id" data={data} columns={columns} hide-checkbox-column="true" onrowaction={handleRowAction}></lightning-datatable>
        </lightning-card>
    </div>
</template>
