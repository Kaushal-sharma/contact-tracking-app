<template>
        <lightning-layout multiple-rows="true">
            <lightning-layout-item size="12">
                <c-health-header tab-name={tabName}></c-health-header>
            </lightning-layout-item>
        </lightning-layout>

        <lightning-layout-item size="12">
            <lightning-tabset variant="vertical" style="background-color:white;">
                <lightning-tab onactive={handleActive} label="Person View" value="person">
                    <lightning-layout>
                        <lightning-layout-item size="8" padding="horizontal-small">
                            <c-recent-changes scope="Person" onpersonview={viewDetail} ></c-recent-changes>
                        </lightning-layout-item>
                        <lightning-layout-item size="4" padding="horizontal-small">
                            <c-person-view></c-person-view>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-tab>

                <lightning-tab onactive={handleActive} label="Location View" value="location">
                    <lightning-layout>
                        <lightning-layout-item size="8" padding="horizontal-small">
                            <c-recent-changes scope="Location" onlocationview={viewDetail}></c-recent-changes>
                        </lightning-layout-item>
                        <lightning-layout-item size="4" padding="horizontal-small"> 
                            <c-location-view></c-location-view>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-tab>
            </lightning-tabset>
        </lightning-layout-item>
</template>
